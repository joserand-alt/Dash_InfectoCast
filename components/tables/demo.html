<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laboratório de Componentes · Módulo de Tabelas</title>
  <link rel="stylesheet" href="tables.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #f8fafc;
      color: #0f172a;
      padding: 40px 24px;
      min-height: 100vh;
    }
    .demo-container {
      max-width: 1200px;
      margin: 0 auto;
    }
    .demo-header {
      margin-bottom: 24px;
      padding-bottom: 20px;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .demo-header h1 {
      font-size: 1.75rem;
      font-weight: 800;
    }
    .demo-header p {
      color: #64748b;
      font-size: 0.95rem;
      margin-top: 4px;
    }
    .log-box {
      background: #1e293b;
      color: #38bdf8;
      font-family: monospace;
      font-size: 0.85rem;
      padding: 14px 18px;
      border-radius: 10px;
      margin-top: 24px;
      min-height: 48px;
      display: flex;
      align-items: center;
    }
    .filter-chips {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    .chip {
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      color: #334155;
      cursor: pointer;
      transition: all 0.15s;
    }
    .chip.active {
      background: #0284c7;
      color: #ffffff;
      border-color: #0284c7;
    }
  </style>
</head>
<body>
  <div class="demo-container">
    <div class="demo-header">
      <div>
        <h1>📋 Módulo de Tabelas Inteligentes · StudentTable</h1>
        <p>Busca em tempo real com debounce, ordenação multi-coluna, cabeçalho fixo e paginação fluida.</p>
      </div>
    </div>

    <!-- Filtros Rápidos por Status -->
    <div class="filter-chips" id="status-filters">
      <button class="chip active" data-status="all">Todos os Alunos (12)</button>
      <button class="chip" data-status="ativo">Ativos (7)</button>
      <button class="chip" data-status="risco">Em Risco (3)</button>
      <button class="chip" data-status="abandono">Abandono (2)</button>
    </div>

    <!-- Container da Tabela -->
    <div id="student-table-container"></div>

    <!-- Log de Interação -->
    <div class="log-box" id="log-box">
      👉 Interaja com a tabela: pesquise por aluno, ordene pelas colunas ou clique em "Ver Jornada".
    </div>
  </div>

  <script type="module">
    import { StudentTable } from './index.js';

    const mockStudents = [
      { id: 1, nome: "Vivian Vidal", email: "vivianvidal01@gmail.com", curso: "PÓS CCIH", status: "Ativo", progresso: 15, aulas_assistidas: 6, total_aulas: 40, ultimo_acesso: "Hoje às 14:20" },
      { id: 2, nome: "Sebastião Ribeiro", email: "sebastiaoribeirocn@gmail.com", curso: "S.O.S ANTIBIÓTICO", status: "Ativo", progresso: 85, aulas_assistidas: 34, total_aulas: 40, ultimo_acesso: "Ontem às 19:10" },
      { id: 3, nome: "Tamara Reis", email: "tpsreis@hotmail.com", curso: "PÓS INFECTOPEDIATRIA", status: "Ativo", progresso: 42, aulas_assistidas: 17, total_aulas: 40, ultimo_acesso: "14/09/2026" },
      { id: 4, nome: "Adryelle Ribeiro", email: "adryelleribeiror@gmail.com", curso: "PÓS CCIH", status: "Ativo", progresso: 95, aulas_assistidas: 38, total_aulas: 40, ultimo_acesso: "12/09/2026" },
      { id: 5, nome: "Nadine Tavares", email: "nadine.tavares@gmail.com", curso: "PÓS ORTOPEDIA", status: "Em Risco", progresso: 28, aulas_assistidas: 11, total_aulas: 40, ultimo_acesso: "35 dias atrás" },
      { id: 6, nome: "Carlos Eduardo Silva", email: "carlosedu@gmail.com", curso: "PÓS IMUNODEPRIMIDOS", status: "Em Risco", progresso: 18, aulas_assistidas: 7, total_aulas: 40, ultimo_acesso: "42 dias atrás" },
      { id: 7, nome: "Juliana Mendes", email: "julianamendes@gmail.com", curso: "PÓS CCIH", status: "Ativo", progresso: 64, aulas_assistidas: 25, total_aulas: 40, ultimo_acesso: "10/09/2026" },
      { id: 8, nome: "Fernando Castro", email: "fcastro@uol.com.br", curso: "S.O.S ANTIBIÓTICO", status: "Abandono", progresso: 5, aulas_assistidas: 2, total_aulas: 40, ultimo_acesso: "75 dias atrás" },
      { id: 9, nome: "Patrícia Lima", email: "patricialima@gmail.com", curso: "PÓS INFECTOPEDIATRIA", status: "Ativo", progresso: 52, aulas_assistidas: 21, total_aulas: 40, ultimo_acesso: "13/09/2026" },
      { id: 10, nome: "Rodrigo Barbosa", email: "rbarbosa@med.br", curso: "PÓS ORTOPEDIA", status: "Em Risco", progresso: 30, aulas_assistidas: 12, total_aulas: 40, ultimo_acesso: "38 dias atrás" },
      { id: 11, nome: "Mariana Costa", email: "marianacosta@yahoo.com.br", curso: "PÓS CCIH", status: "Abandono", progresso: 0, aulas_assistidas: 0, total_aulas: 40, ultimo_acesso: "89 dias atrás" },
      { id: 12, nome: "Lucas Fontes", email: "lucasfontes@gmail.com", curso: "S.O.S ANTIBIÓTICO", status: "Ativo", progresso: 78, aulas_assistidas: 31, total_aulas: 40, ultimo_acesso: "Hoje às 10:15" }
    ];

    const logEl = document.getElementById('log-box');
    function log(msg) {
      logEl.innerHTML = `⚡ <strong>Evento:</strong> ${msg}`;
    }

    // Instancia a StudentTable
    const studentTable = new StudentTable({
      students: mockStudents,
      pageSize: 5,
      onVerJornada: (student) => {
        log(`Abrindo Modal da Jornada do Aluno: <strong>${student.nome}</strong> (${student.email}) - Curso: ${student.curso}`);
      },
      onRowClick: (student) => {
        log(`Linha clicada: <strong>${student.nome}</strong> - Progresso: ${student.progresso}%`);
      }
    }).mount('#student-table-container');

    // Filtros rápidos
    document.querySelectorAll('#status-filters .chip').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#status-filters .chip').forEach(c => c.classList.remove('active'));
        btn.classList.add('active');

        const status = btn.dataset.status;
        if (status === 'all') {
          studentTable.setData(mockStudents);
          log('Exibindo todos os alunos.');
        } else {
          const filtered = mockStudents.filter(s => s.status.toLowerCase().includes(status));
          studentTable.setData(filtered);
          log(`Filtrando alunos por status: <strong>${status.toUpperCase()}</strong> (${filtered.length} encontrados)`);
        }
      });
    });
  </script>
</body>
</html>
